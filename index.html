<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 이름을 채운 뒤 예: "홍길동 | 데이터 운영·분석 포트폴리오" -->
  <title>데이터 운영·분석 포트폴리오</title>
  <meta name="description" content="컴퓨터공학과 3학년, 데이터 운영·분석 직무 포트폴리오">
  <!-- 카카오톡·슬랙 등에 링크를 붙였을 때 보이는 미리보기 문구 -->
  <meta property="og:title" content="데이터 운영·분석 포트폴리오">
  <meta property="og:description" content="컴퓨터공학과 3학년, 데이터 운영·분석 직무 포트폴리오">
  <!-- 파비콘 요청을 막아 불필요한 404를 없앰 -->
  <link rel="icon" href="data:,">
  <!-- 웹폰트: 지우면 시스템 글꼴로 표시되고 더 가벼워짐 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 키보드 사용자가 메뉴를 건너뛰고 본문으로 바로 이동 -->
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header">
    <div class="container header-inner">
      <!-- 이름 -->
      <a class="brand" href="#top"><span class="todo">[작성 필요]</span></a>
      <nav aria-label="주요 메뉴" data-scrollspy>
        <ul class="nav-list">
          <li><a href="#skills">기술</a></li>
          <li><a href="#projects">프로젝트</a></li>
          <li><a href="#certs">자격증·어학</a></li>
          <li><a href="#contact">연락처</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">
    <!-- ===== 1. 첫 화면 (Hero): 30초 안에 "누구인지, 무엇을 해냈는지" ===== -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <div class="container">
        <p class="hero-eyebrow">컴퓨터공학과 3학년 · 데이터 운영·분석 직무 지원</p>
        <!-- 이름 -->
        <h1 class="hero-name" id="hero-title"><span class="todo">[작성 필요]</span></h1>
        <!-- 한 줄 소개. 예: 데이터를 정제하고, 결과를 숫자로 검증하는 개발자 -->
        <p class="hero-intro"><span class="todo">[작성 필요]</span></p>

        <div class="hero-actions">
          <a class="btn btn-primary" href="#projects">프로젝트 보기</a>
          <!-- assets/resume.pdf 파일을 넣으면 바로 동작 -->
          <a class="btn btn-secondary" href="assets/resume.pdf" download>이력서 PDF 다운로드</a>
        </div>

        <!-- 핵심 성과 3개: 숫자(value) + 무엇을 잰 숫자인지(label) + 근거 프로젝트(source) -->
        <h2 class="visually-hidden">핵심 성과</h2>
        <ul class="metrics">
          <li class="metric-card">
            <!-- 예: 1,240건 → 0건 -->
            <p class="metric-value"><span class="todo">[작성 필요]</span></p>
            <!-- 예: 결측치 정제 전후 -->
            <p class="metric-label"><span class="todo">[작성 필요]</span></p>
            <!-- 예: <a href="projects/project-1.html">프로젝트 1</a> -->
            <p class="metric-source">근거 <span class="todo">[작성 필요]</span></p>
          </li>
          <li class="metric-card">
            <!-- 예: 87% -->
            <p class="metric-value"><span class="todo">[작성 필요]</span></p>
            <!-- 예: 분류 정확도 (테스트셋 기준) -->
            <p class="metric-label"><span class="todo">[작성 필요]</span></p>
            <p class="metric-source">근거 <span class="todo">[작성 필요]</span></p>
          </li>
          <li class="metric-card">
            <p class="metric-value"><span class="todo">[작성 필요]</span></p>
            <p class="metric-label"><span class="todo">[작성 필요]</span></p>
            <p class="metric-source">근거 <span class="todo">[작성 필요]</span></p>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
